<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Matchday Sports Hub</title>
  
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Hero Header Section -->
  <header class="hero-section text-white text-center py-5 shadow-sm">
    <div class="container py-3">
      <span class="badge bg-primary-subtle text-primary border border-primary px-3 py-2 rounded-pill fw-semibold mb-3">
        Live Fixtures & Standings
      </span>
      <h1 class="display-4 fw-bold mb-3">Never Miss a Matchday</h1>
      <p class="lead col-lg-8 mx-auto mb-4">
        Track match results, filter fixtures across top European leagues in real-time, and inspect current league table standings.
      </p>
      <div class="d-flex justify-content-center gap-3 flex-wrap">
        <a href="#controls-section" class="btn btn-primary btn-lg px-4">
          Explore Fixtures <i class="bi bi-arrow-down-short ms-1"></i>
        </a>
        <button class="btn btn-outline-warning btn-lg px-4" data-bs-toggle="modal" data-bs-target="#standingsModal">
          <i class="bi bi-trophy me-1"></i> View Standings
        </button>
      </div>
    </div>
  </header>

  <!-- Main Content Container -->
  <main class="container my-5">
    
    <div id="alert-box" class="mb-4"></div>

    <!-- Search & Filter Controls -->
    <section id="controls-section" class="card shadow-sm p-4 mb-5 border-0 rounded-3">
      <div class="row g-3">
        <div class="col-md-5">
          <label for="search-team" class="form-label fw-semibold text-secondary small">Search Team</label>
          <div class="input-group">
            <span class="input-group-text border-end-0 bg-transparent"><i class="bi bi-search text-muted"></i></span>
            <input type="text" id="search-team" class="form-control border-start-0" placeholder="e.g. Arsenal, Real Madrid...">
          </div>
        </div>
        
        <div class="col-md-4">
          <label for="select-league" class="form-label fw-semibold text-secondary small">League</label>
          <select id="select-league" class="form-select">
            <option value="4328" selected>English Premier League</option>
            <option value="4335">Spanish La Liga</option>
            <option value="4331">German Bundesliga</option>
            <option value="4332">Italian Serie A</option>
            <option value="4480">UEFA Champions League</option>
          </select>
        </div>

        <div class="col-md-3">
          <label for="select-status" class="form-label fw-semibold text-secondary small">Match Status</label>
          <select id="select-status" class="form-select">
            <option value="all" selected>All Statuses</option>
            <option value="FT">Finished (FT)</option>
            <option value="NS">Upcoming (NS)</option>
          </select>
        </div>
      </div>
    </section>

    <!-- Match Cards Grid -->
    <section class="row" id="match-container">
      <!-- Match cards dynamically rendered by js/app.js -->
    </section>

    <!-- Load More Button -->
    <div class="text-center mt-4">
      <button id="load-more-btn" class="btn btn-outline-primary btn-lg px-5 d-none">
        Load More Fixtures
      </button>
    </div>
  </main>

  <!-- Footer -->
  <footer class="text-center py-4 border-top border-secondary text-white-50 mt-5">
    <div class="container">
      <p class="mb-0 small">Matchday Sports Hub &copy; 2026 | Built with ♥</p>
    </div>
  </footer>

  <!-- Floating Back to Top Button -->
  <button id="back-to-top" class="hidden" title="Back to top">
    <i class="bi bi-arrow-up"></i>
  </button>

  <!-- Standings Modal -->
  <div class="modal fade" id="standingsModal" tabindex="-1" aria-labelledby="standingsModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-lg">
      <div class="modal-content text-white" style="background-color: #0f172a; border: 1px solid rgba(0, 240, 255, 0.3);">
        <div class="modal-header border-secondary">
          <h5 class="modal-title fw-bold" id="standingsModalLabel">🏆 League Table Standings</h5>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <div id="standings-table-container">
          </div>
        </div>
        <div class="modal-footer border-secondary">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Bootstrap 5 JS Bundle -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/bootstrap.bundle.min.js"></script>
  
  <script src="js/app.js"></script>
</body>
</html>
