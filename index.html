<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Matchday Sports Hub</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    
</head>
<body class="bg-light min-vh-100 d-flex flex-column">

    <!-- NavBar -->
     <nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm sticky-top">
        <div class="container">
            <a class="navbar-brand fw-bold" href="#">
                <i class="bi bi-trophy-fil me-2"></i>Matchday Sports Hub
            </a>
            <button class="btn btn-outline-light btn-sm ms-auto"
            data-bs-toggle="modal"
            data-bs-target="predictionModal"
            >
                <i class="bi bi-plus-circle me-1"></i> Submit Prediction
            </button>
        </div>
     </nav>

     <!-- Hero Section -->
      <header class="hero-section text-white text-center py-5 shadow-sm">
        <div class="container py-3">
            <span class="badge bg-primary-subtle text-primary border border-primary px-3 py-2 rounded-pill fw-semibold mb-3">
                Live Fixtures & Standings
            </span>
            <h1 class="display-4 fw-bold mb-3">Never Miss a Matchday</h1>
            <p class="lead text-secondary col-lg-8 mx-auto mb-4">
                Track live match results, filter fictures across top leagues in real-time and submit score predictions-all in one fast, ad-free dashboard.
            </p>
            <div class="d-flex justify-content-center gap-3">
                <a href="#controls-section" class="btn btn-primary btn-lg px-4">
                    Explore Fixtures <i class="bi bi-arrow-down-short ms-1"></i>
                </a>
                <button class="btn btn-outline-light btn-lg px-4" data-bs-toggle="modal" data-bs-target="#predictionModal">
                    Submit Prediction
                </button>
            </div>
        </div>
      </header>
    




















    <!-- Footer -->  
     <footer class="bg-white border-top py-4 text-center text-muted small mt-auto">
        <div class="container">
            <p class="mb-1 fw-semibold text-dark">Matchday Sports Hub</p>
            <p class="mb-0">Built with ♥</p>
        </div>
     </footer>

     
    <script src="js/app.js"></script>
</body>
</html>
